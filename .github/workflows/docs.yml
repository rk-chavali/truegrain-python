name: Docs

# API reference, generated from the docstrings rather than maintained by hand.
#
# Hand-written reference documentation is documentation that goes stale the
# first time somebody is in a hurry. These pages come from the same docstrings
# a reader sees in their editor, so the two cannot disagree.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a queued run is not cancelled: it would leave
# the published docs describing a commit that is no longer main.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e . pdoc

      - name: Generate the API reference
        run: |
          pdoc truegrain \
            --output-directory site \
            --docformat google \
            --logo-link https://github.com/rk-chavali/truegrain \
            --footer-text "truegrain $(python -c 'import truegrain; print(truegrain.__version__)')"

      # enablement so the first run on a fresh fork turns Pages on rather than
      # failing with "Get Pages site failed", which is what happened here and
      # reads like a broken workflow rather than a setting nobody had flipped.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
